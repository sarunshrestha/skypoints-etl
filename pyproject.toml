[project]
name = "skypoints-etl"
version = "0.1.0"
description = "SkyPoints loyalty member ETL: flat-file + JSON redemption feeds into per-country tables"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "duckdb>=1.0", "sqlglot>=25"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
